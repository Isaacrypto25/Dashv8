<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso | Sistema de Estoque</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; --bg: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { 
      display: flex; justify-content: center; align-items: center; min-height: 100vh; 
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 20px;
    }
    .card { 
      background: #fff; padding: 40px; border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 380px; 
    }
    .input { 
      width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #d1d5db; 
      border-radius: 8px; font-size: 16px; transition: 0.2s;
    }
    .input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .btn { 
      width: 100%; padding: 14px; background: var(--primary); color: white; 
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px;
    }
    .btn:hover { background: #1d4ed8; }
    .error { 
      color: #ef4444; background: #fef2f2; padding: 10px; border-radius: 6px; 
      margin-bottom: 15px; font-size: 13px; display: none; text-align: center; border: 1px solid #fee2e2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align:center; margin-bottom: 25px;">
        <h2 style="color:#1e293b">Logística</h2>
        <p style="font-size:12px; color:#64748b; margin-top:5px">Identifique-se para continuar</p>
    </div>
    
    <div id="error" class="error">Usuário ou senha incorretos</div>
    
    <form onsubmit="event.preventDefault(); autenticar();">
        <input id="user" class="input" type="text" placeholder="Usuário" required>
        <input id="pass" class="input" type="password" placeholder="Senha" required>
        <button type="submit" class="btn">ENTRAR NO SISTEMA</button>
    </form>
  </div>

  <script>
    function autenticar() {
      const u = document.getElementById('user').value;
      const p = document.getElementById('pass').value;
      
      if (u === "73004790" && p === "Tricolor.406936") {
        localStorage.setItem('session_active', 'true');
        window.location.href = "dashboard.html"; // Redireciona para a página do sistema
      } else {
        const err = document.getElementById('error');
        err.style.display = "block";
        document.getElementById('pass').value = "";
      }
    }
  </script>
</body>
</html>
