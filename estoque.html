<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estoque</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="global.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="logo">OBRAMAX</div>
    <a href="dashboard.html">Dashboard</a>
    <a href="produtos.html">Produtos</a>
    <a class="active" href="estoque.html">Estoque</a>
    <a href="pedidos.html">Pedidos</a>
  </aside>

  <main class="content">
    <h2>Estoque</h2>

    <section class="kanban">

      <!-- SAUDÁVEL -->
      <div class="coluna" data-status="success">
        <header onclick="toggleColuna(this)">
          <div>
            <strong id="saudavelQtd">0</strong>
            <span>Saudável</span>
          </div>
          <span class="arrow">⌄</span>
        </header>
        <div class="coluna-body" id="saudavelLista"></div>
      </div>

      <!-- CRÍTICO -->
      <div class="coluna" data-status="warning">
        <header onclick="toggleColuna(this)">
          <div>
            <strong id="criticoQtd">0</strong>
            <span>Crítico</span>
          </div>
          <span class="arrow">⌄</span>
        </header>
        <div class="coluna-body" id="criticoLista"></div>
      </div>

      <!-- RUPTURA -->
      <div class="coluna" data-status="danger">
        <header onclick="toggleColuna(this)">
          <div>
            <strong id="rupturaQtd">0</strong>
            <span>Ruptura</span>
          </div>
          <span class="arrow">⌄</span>
        </header>
        <div class="coluna-body" id="rupturaLista"></div>
      </div>

    </section>

  </main>
</div>

<script src="estoque.js"></script>
</body>
</html>
